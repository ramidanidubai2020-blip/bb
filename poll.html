<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b35" />
    <meta name="description" content="A little date question for someone special." />
    <title>A Little Date?</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
    <script src="poll.js" defer></script>
  </head>
  <body data-photo-storage-key="a-little-date-poll-background">
    <div class="scene" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>

    <div class="page-shell">
      <header class="topbar">
        <a class="wordmark" href="index.html" aria-label="Back to the hello page">
          <span class="wordmark-mark" aria-hidden="true">a.</span>
          <span class="wordmark-name">a little hello</span>
        </a>
        <div class="photo-tools">
          <input id="photo-input" class="visually-hidden" type="file" accept="image/*" />
          <label class="photo-button" for="photo-input">Choose second photo</label>
          <button id="remove-photo" class="remove-photo" type="button" hidden>Remove photo</button>
        </div>
      </header>

      <main class="invitation poll-invitation">
        <div class="invitation-content poll-content">
          <p class="kicker"><span class="kicker-line" aria-hidden="true"></span> One little question</p>
          <div class="poll-question-row">
            <p class="poll-side-note">And we can take some photos.</p>
            <div class="poll-question">
              <h1>Can we go out<br class="desktop-break" /> for a little date?</h1>
              <p class="supporting-copy">Pick the answer that feels right.</p>
            </div>
          </div>

          <div id="poll-choices" class="poll-choices" role="group" aria-label="Choose your answer">
            <button class="poll-answer poll-answer-yes" type="button" data-answer="yes">Yes, I will be happy</button>
            <button class="poll-answer poll-answer-no" type="button" data-answer="no">No, you are ugly</button>
          </div>

          <section id="poll-response" class="poll-response" aria-live="polite" hidden>
            <p id="poll-response-note" class="poll-response-note"></p>
            <a id="date-plan-link" class="next-page-link" href="date-details.html" hidden>Plan our date <span aria-hidden="true">&#8594;</span></a>
            <button id="change-answer" class="text-button" type="button">Choose again</button>
          </section>
        </div>
        <p class="poll-privacy"><span class="status-dot" aria-hidden="true"></span> Your answer is saved only on this device</p>
      </main>

      <footer class="bottom-bar">
        <span>A LITTLE QUESTION FOR YOU</span>
        <span class="footer-mark" aria-hidden="true">♥</span>
      </footer>
    </div>
    <p id="photo-status" class="visually-hidden" role="status"></p>
  </body>
</html>
